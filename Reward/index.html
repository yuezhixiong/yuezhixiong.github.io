<!DOCTYPE HTML>
<html>

<head>
  <meta charset="utf-8">
  <meta name="format-detection" content="telephone=no" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/atom.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/open.css">
  <title>开宝箱赢钻石</title>
</head>

<body ontouchstart="" class="open-body">
  <div class="wrapper">

    <div class="bg rotate"></div>
    <div class="open-has">
      <h3 class="title-close"><span class="user">熊仔</span>给你发了一个宝箱</h3>
      <h3 class="title-open">恭喜你，</br>成功领取<span class="user">秀仔专属</span>宝箱</h3>

      <div class="mod-chest">

        <div class="chest-close show ">
          <div class="gift"></div>
          <div class="tips">
            <i class="arrow"></i>
          </div>
        </div>
        <div class="chest-open">
          <div class="mod-chest-cont open-cont">
            <div class="content">
              <div class="gift">
                <div class="icon"><img src="img/chest-icon-zuan.png"></div>
                <zuan_num>x </zuan_num>
              </div>
              <div class="func">
                <button class="chest-btn">再开一次</button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
    <div class="open-none" style="display:none">
      <h3>你来晚啦，下次早点吧！</h3>
      <div class="mod-chest">
        <div class="chest-open show"></div>
      </div>
      <div class="func">
        <button class="chest-btn">查看领取详情</button>
      </div>
    </div>
  </div>
  <script type="text/javascript" src="js/zepto.min.js"></script>
  <script type="text/javascript">

    $(".chest-close").click(function () {
      var num = Math.round(Math.random() * 1000);
      $('zuan_num').replaceWith('<zuan_num>x ' + num + '</zuan_num>');

      $(this).addClass("shake");
      var that = this;
      this.addEventListener("webkitAnimationEnd", function () {


        $(that).closest(".open-has").addClass("opened");
        setTimeout(function () {
          $(that).removeClass("show");
          $(that).closest(".mod-chest").find(".chest-open").addClass("show");
          setTimeout(function () {
            $(".chest-open").addClass("blur");
          }, 500)
        }, 200)
      }, false);
    })

    $(".chest-btn").click(function () {
      $(".chest-close").removeClass("shake");
      $(".chest-close").closest(".open-has").removeClass("opened");
      $(".chest-close").addClass("show");
      $(".chest-close").closest(".mod-chest").find(".chest-open").removeClass("show");
    })

  </script>

</body>

</html>
