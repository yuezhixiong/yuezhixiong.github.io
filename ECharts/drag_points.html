<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>ECharts</title>
    <!-- 引入 echarts.js -->
    <script src="echarts.js"></script>
    <script src="jQuery.js"></script>
</head>

<body>
    <!-- 为ECharts准备一个具备大小（宽高）的Dom -->
    <div id="main"></div>
    <script type="text/javascript">
        // 基于准备好的dom，初始化echarts实例
        main.style.width = window.innerWidth - 20 + 'px';
        main.style.height = window.innerHeight - 20 + 'px';
        var myChart = echarts.init(document.getElementById('main'));
        
        var symbolSize = 10;

        var points = [];
        var data;
        $.get("./data/london.stations.csv", function(data) {     
            var rows = data.split('\n');
            for (var i=1; i<rows.length-1; i++) {
                var row = rows[i].split(',')
                var pname = row[3].replace(/"/g,'');
                var px = parseFloat(row[1]);
                var py = parseFloat(row[2]);
                points[i-1] = {name: pname, x: px, y: py};
            }
        });

        console.log(points);
        
        
        // 指定图表的配置项和数据
        option = {
            grid: {
            },
            series: [
                {
                    type: 'graph',
                    symbolSize: symbolSize,
                    data: points
                }
            ]
        };

        // 使用刚指定的配置项和数据显示图表。
        myChart.setOption(option);
    </script>
</body>

</html>
