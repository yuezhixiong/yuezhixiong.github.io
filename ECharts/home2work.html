<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Home2Work</title>
    <!-- 引入 echarts.js -->
    <script src="echarts.js"></script>
</head>

<body>
    <!-- 为ECharts准备一个具备大小（宽高）的Dom -->
    <div id="main"></div>
    <script type="text/javascript">
        // time table
        var now = new Date();
        var now_time = now.getHours() + ':' + now.getMinutes();

        var tb_428 = ['04:20', '04:50', '05:20', '05:40', '05:58', '06:20', '06:40', '07:07', '07:22',
            '07:34', '07:44', '07:55', '08:04', '08:08', '08:16', '08:22', '08:29', '08:37',
            '08:43', '08:57', '09:11', '09:24', '09:37', '09:52', '10:07', '10:22', '10:37',
            '10:52', '11:07', '11:22', '11:37', '11:52', '12:07', '12:22', '12:37', '12:52',
            '10:52', '11:07', '11:22', '11:37', '11:52', '12:07', '12:22', '12:37', '12:52',
            '13:07', '13:22', '13:37', '13:52', '14:05', '14:22', '14:41', '14:52', '15:04',
            '15:22', '15:42', '15:54', '16:04', '16:13', '16:23', '16:33', '16:43',
            '16:55', '16:59', '17:06', '17:18', '17:30', '17:52', '18:13', '18:29', '18:49',
            '19:09', '19:30', '19:55', '20:30', '21:00', '21:30', '22:00', '22:30', '23:00',
            '23:30', '01:25'];

        for (var i = 0; i < tb_428.length; i++) {
            var tb = tb_428[i].split(':');
            var t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), tb[0], tb[1], 0);

            if (t >= now) {
                var min_428 = Math.ceil((t.getTime() - now.getTime()) / 1000 / 60);
                tb_428.splice(0, i);
                break;
            }
        }

        var tb_426 = ['05:07', '05:25', '05:45', '06:05', '06:25', '06:48', '07:02', '07:16', '07:26',
                '07:35', '07:45', '07:50', '07:56', '08:05', '08:18', '08:30', '08:46', '09:00', '09:14', '09:28',
                '09:41', '09:56', '10:11', '10:26', '10:41', '10:56', '11:11', '11:26', '11:41', '11:56', '12:11',
                '12:26', '12:41', '12:56', '13:11', '13:26',

                '19:12', '19:33', '19:50', '20:10', '20:40', '21:10', '21:40', '22:10', '22:40', '23:10'];

        for (var i = 0; i < tb_426.length; i++) {
            var tb = tb_426[i].split(':');
            var t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), tb[0], tb[1], 0);

            if (t >= now) {
                var min_426 = Math.ceil((t.getTime() - now.getTime()) / 1000 / 60);
                tb_426.splice(0, i);
                break;
            }
        }

        var tb_L28 = ['07:00','07:28','07:40','07:51','08:02','08:11','08:22','08:34'];

        for (var i = 0; i < tb_L28.length; i++) {
            var tb = tb_L28[i].split(':');
            var t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), tb[0], tb[1], 0);

            if (t >= now) {
                var min_L28 = Math.ceil((t.getTime() - now.getTime()) / 1000 / 60);
                tb_L28.splice(0, i);
                break;
            }
            if ( i== tb_L28.length-1){
                tb_L28 = ['No L28 today']
            }
        }

        // 基于准备好的dom，初始化echarts实例
        main.style.width = window.innerWidth - 20 + 'px';
        main.style.height = window.innerHeight - 20 + 'px';
        var myChart = echarts.init(document.getElementById('main'));

        var categories = [];
        categories[0] = {
            name: 'Location'
        };
        categories[1] = {
            name: 'Bus'
        };
        categories[2] = {
            name: 'Train'
        };

        // 指定图表的配置项和数据
        option = {
            title: {
                text: now_time
            },
            tooltip: {},
            legend: [{
                // selectedMode: 'single',
                data: categories.map(function (a) {
                    return a.name;
                }),
                orient: 'vertical',
                left: 'left',
                top: '10%',
                selected: {
                    'Train': false
                },

                tooltip: {
                    show: true,
                    formatter: function(params) {
                        if(params.name == 'Bus') {
                            return '428: '+min_428+' mins'+'<p>'+'426: '+min_426+' mins'+'<p>'+'L28: '+min_L28+' mins'
                        }
                    }
                }
            }],
            animationDurationUpdate: 1500,
            animationEasingUpdate: 'quinticInOut',
            series: [
                {
                    tooltip: {},
                    type: 'graph',
                    layout: 'none',
                    focusNodeAdjacency: true,
                    roam: true,
                    label: {
                        show: true
                    },
                    edgeSymbol: ['circle', 'arrow'],
                    edgeSymbolSize: 10,
                    itemStyle: {
                        borderColor: '#fff',
                        borderWidth: 1,
                        shadowBlur: 10,
                        shadowColor: 'rgba(0, 0, 0, 0.3)'
                    },
                    lineStyle: {
                        opacity: 0.5,
                        width: 5,
                        curveness: 0
                    },
                    symbol: 'rect',
                    symbolSize: 50,
                    emphasis: {
                        lineStyle: {
                            width: 10,
                            label: {
                                show: true
                            }
                        }
                    },
                    categories: categories,
                    data: [{
                        name: 'Home',
                        x: 0,
                        y: 0,
                        symbol: 'roundRect',
                        category: 0
                    }, {
                        name: 'New Canterbury Rd at Lewisham St',
                        x: -200,
                        y: -150,
                        category: 1,
                        tooltip: {
                            formatter: function () {
                                var res = 'Bus 428 in '+min_428+' mins <p>'
                                for (var i = 0; i < tb_428.length; i++) {
                                    res += tb_428[i] + ' ';
                                    if ((i + 1) % 9 == 0) {
                                        res += '<p>'
                                    }
                                }
                                res += '<p>Bus L28 in '+min_L28+' mins <p>'
                                for (var i = 0; i < tb_L28.length; i++) {
                                    res += tb_L28[i] + ' ';
                                    if ((i + 1) % 9 == 0) {
                                        res += '<p>'
                                    }
                                }
                                return res;
                            }
                        }
                    }, {
                        name: 'Petersham Station',
                        x: 300,
                        y: -700,
                        category: 2
                    }, {
                        name: 'Broadway Shopping Centre',
                        x: 1000,
                        y: -800,
                        category: 1
                    }, {
                        name: 'Marrickville Rd after New Canterbury Rd',
                        x: 100,
                        y: 150,
                        category: 1,
                        tooltip: {
                            formatter: function () {
                                var res = 'Bus 426 in '+min_426+' mins <p>'
                                for (var i = 0; i < tb_426.length; i++) {
                                    res += tb_426[i] + ' ';
                                    if ((i + 1) % 7 == 0) {
                                        res += '<p>'
                                    }
                                }
                                return res;
                            }
                        }
                    }, {
                        name: 'UTS',
                        x: 1700,
                        y: -800,
                        category: 1
                    }, {
                        name: 'Sydenham Station',
                        x: 850,
                        y: 300,
                        category: 2
                    }, {
                        name: 'Central Station',
                        x: 1800,
                        y: -500,
                        category: 2
                    }, {
                        name: 'Work',
                        x: 1400,
                        y: -900,
                        symbol: 'roundRect',
                        category: 0
                    }],

                    links: [{
                        value: '426',
                        source: 'Marrickville Rd after New Canterbury Rd',
                        target: 'UTS',
                        label: {
                            show: true,
                            formatter: '{c}'
                        }
                    }, {
                        value: '10m',
                        source: 'Home',
                        target: 'Marrickville Rd after New Canterbury Rd',
                        label: {
                            show: true,
                            formatter: '{c}'
                        },
                        lineStyle: {
                            type: 'dotted'
                        }
                    }, {
                        value: '180m',
                        source: 'UTS',
                        target: 'Work',
                        label: {
                            show: true,
                            formatter: '{c}'
                        },
                        lineStyle: {
                            type: 'dotted'
                        }
                    }, {
                        value: '418 / 425',
                        source: 'Marrickville Rd after New Canterbury Rd',
                        target: 'Sydenham Station',
                        label: {
                            show: true,
                            formatter: '{c}'
                        }
                    }, {
                        value: 'T3 / T4',
                        source: 'Sydenham Station',
                        target: 'Central Station',
                        label: {
                            show: true,
                            formatter: '{c}'
                        },
                        lineStyle: {
                            type: 'dashed'
                        }
                    }, {
                        value: '650m',
                        source: 'Central Station',
                        target: 'UTS',
                        label: {
                            show: true,
                            formatter: '{c}'
                        },
                        lineStyle: {
                            type: 'dotted'
                        }
                    }, {
                        value: '50m',
                        source: 'Home',
                        target: 'New Canterbury Rd at Lewisham St',
                        label: {
                            show: true,

                        },
                        lineStyle: {
                            type: 'dotted'
                        }
                    }, {
                        value: '445',
                        source: 'New Canterbury Rd at Lewisham St',
                        target: 'Petersham Station',
                        label: {
                            show: true,
                            formatter: '{c}'
                        }
                    }, {
                        value: '428',
                        source: 'New Canterbury Rd at Lewisham St',
                        target: 'UTS',
                        label: {
                            show: true,
                            formatter: '{c}'
                        }
                    }, {
                        value: 'T2',
                        source: 'Petersham Station',
                        target: 'Central Station',
                        label: {
                            show: true,
                            formatter: '{c}'
                        },
                        lineStyle: {
                            type: 'dashed'
                        }
                    }, {
                        value: '350m',
                        source: 'Broadway Shopping Centre',
                        target: 'Work',
                        label: {
                            show: true,
                            formatter: '{c}'
                        },
                        lineStyle: {
                            type: 'dotted'
                        }
                    }, {
                        value: 'L28',
                        source: 'New Canterbury Rd at Lewisham St',
                        target: 'Broadway Shopping Centre',
                        label: {
                            show: true,
                            formatter: '{c}'
                        }
                    }],
                }
            ]
        };

        // 使用刚指定的配置项和数据显示图表。
        myChart.setOption(option);
    </script>
</body>

</html>
