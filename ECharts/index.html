<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <!-- 引入 ECharts 文件 -->
    <script src="echarts.js"></script>
    <script src="jQuery.js"></script>
</head>

<body>
    <!-- 为ECharts准备一个Dom -->
    <div id="main"></div>
    <script type="text/javascript">
        $.ajax({
            async: false,
            url: 'https://www.alphavantage.co/query?function=FX_DAILY&from_symbol=AUD&to_symbol=CNY&outputsize=compact&apikey=GRQ6VGHVCHWIOV9Q&datatype=csv',
        }).done(successFunction);

        //jQuery return data
        function successFunction(data) {
            var timestamp = new Array();
            var data_array = [...Array(100)].map(e => Array(4));
            var bar_array = [];
            var rows = data.split('\n');
            var i;
            var num = 100;
            for (i = 1; i <= num; i++) {
                // timestamp,open,high,low,close
                timestamp[num - i] = rows[i].split(',')[0];
                data_array[num - i][0] = rows[i].split(',')[1]; //open
                data_array[num - i][3] = rows[i].split(',')[2]; // high
                data_array[num - i][2] = rows[i].split(',')[3]; // low
                data_array[num - i][1] = rows[i].split(',')[4]; // close

                bar_array[num - i] = rows[i].split(',')[4];
            }
            //EChart大小自适应
            main.style.width = window.innerWidth-20+'px';
            main.style.height = window.innerHeight-20+'px';
            // 基于准备好的dom，初始化echarts实例            
            var myChart = echarts.init(document.getElementById('main'));

            // 指定图表的配置项和数据
            option = {
                xAxis: {
                    name: 'Date',
                    type: 'category',
                    data: timestamp,
                },
                yAxis: {
                    name: 'CNY/AUD',
                    min: 'dataMin',
                    max: 'dataMax',
                    maxInterval: 0.1
                },
                series: [{
                    type: 'k',
                    // open, close, low, high
                    data: data_array
                }]
            };


            // 使用刚指定的配置项和数据显示图表。
            myChart.setOption(option);
        }


    </script>
</body>

</html>
