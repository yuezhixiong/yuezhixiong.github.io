<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <!-- 引入 ECharts 文件 -->
    <script src="echarts.js"></script>
    <script src="jQuery.js"></script>
    <title>Gold</title>
</head>

<body>
    <!-- 为ECharts准备一个Dom -->
    <div id="main"></div>
    <script type="text/javascript">
        $.ajax({
            async: false,
            url: 'https://www.quandl.com/api/v3/datasets/LBMA/GOLD.csv?api_key=pBxhFqWsqjc54SiCozJW&start_date=2000-01-01',
        }).done(successFunction);

        //jQuery return data
        function successFunction(data) {
            //EChart大小自适应
            main.style.width = window.innerWidth - 20 + 'px';
            main.style.height = window.innerHeight - 20 + 'px';
            // 基于准备好的dom，初始化echarts实例            
            var myChart = echarts.init(document.getElementById('main'));

            var rows = data.split('\n');
            var i;
            var num = rows.length;
            var timestamp = [];
            var data_array = [];
            console.log(num);
            console.log(rows[0]);
            for (i = 1; i < num; i++) {
                // timestamp, am
                timestamp[num - i - 1] = rows[i].split(',')[0];
                data_array[num - i - 1] = rows[i].split(',')[1]; //am
            }

            // 指定图表的配置项和数据
            option = {
                tooltip: { trigger: 'axis' },
                xAxis: {
                    name: 'Date',
                    type: 'category',
                    data: timestamp
                },
                yAxis: {
                    name: 'USD/ounce',
                    min: 'dataMin',
                    max: 'dataMax',
                    // maxInterval: 0.1
                },
                dataZoom: [{
                    startValue: '2018-01-02'
                }, {
                    type: 'inside'
                }],
                series: {
                    name: 'Gold',
                    type: 'line',
                    data: data_array
                }
            };

            // 使用刚指定的配置项和数据显示图表。
            myChart.setOption(option);
        }
    </script>
</body>

</html>
