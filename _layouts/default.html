<!DOCTYPE html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link href='https://fonts.googleapis.com/css?family=Architects+Daughter' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}" media="screen" type="text/css">
    <link rel="stylesheet" href="{{ '/assets/css/print.css' | relative_url }}" media="print" type="text/css">
    <link rel="bookmark icon" href="/oli_favicon.ico">

    <title>{{ site.title | default: site.github.repository_name }}</title>
</head>

<body>
    <header>
        <div class="inner">
            <a href="{{ '/' | absolute_url }}">
                <h1>{{ site.title | default: site.github.repository_name }}</h1>
            </a>
            <h2>{{ site.description | default: site.github.project_tagline }}</h2>
        </div>
    </header>

    <div id="content-wrapper">
        <div class="inner clearfix">
            <section id="main-content">
                {{ content }} {% if page.comments %}
                <!-- <div id="disqus_thread"></div>
                <script>
                    (function() { // DON'T EDIT BELOW THIS LINE
                        var d = document,

                        s.src = 'https://oliver-q-github-io.disqus.com/embed.js';
                        s.setAttribute('data-timestamp', +new Date());
                        (d.head || d.body).appendChild(s);
                    })();
                </script>
                <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments
                        powered by Disqus.</a></noscript> {% endif %} -->
            </section>

            <aside id="sidebar">
                <p>
                    <script>
                        (function() {
                            var cx = '002836841390184586490:kyjuvezhft4';
                            var gcse = document.createElement('script');
                            gcse.type = 'text/javascript';
                            gcse.async = true;
                            gcse.src = 'https://cse.google.com/cse.js?cx=' + cx;
                            var s = document.getElementsByTagName('script')[0];
                            s.parentNode.insertBefore(gcse, s);
                        })();
                    </script>
                    <gcse:searchbox-only></gcse:searchbox-only>

                    <br>
                    <br>
                    <br>
                    <img src="{{ site.url }}/assets/icon/mail_icon.png">
                    <a target="_blank" href="http://mail.qq.com/cgi-bin/qm_share?t=qm_mailme&email=6pOfj5CCg5KDhYSNqoyFkoeLg4bEiYWH">Email
                        me</a>
                    <br>
                    <br>
                    <img src="{{ site.url }}/assets/icon/location_icon.png"> SUSTech
                    <br>
                    <hr />
                    <h2>Other Pages</h2>

                    <img src="{{ site.url }}/assets/icon/medium.png"><a href="https://medium.com/@yuezhixiong915">Medium</a><br>
                    <br>
                    <img src="{{ site.url }}/assets/icon/zhihu.png"><a href="https://zhihu.com/people/yuezhixiong/posts">知乎</a><br>
                    <br>
<!--                     <img src="{{ site.url }}/assets/icon/github.png"><a href="https://github.com/yuezhixiong">GitHub</a><br> -->
<!--                     <br> -->
                    <img src="{{ site.url }}/assets/icon/linkedin.png"><a href="https://www.linkedin.com/in/zhixiong-yue">LinkedIn</a><br>
                    <br>
                    <img src="{{ site.url }}/assets/icon/google_scholar.png"><a href="https://scholar.google.com/citations?user=-1daeUIAAAAJ&hl">GoogleScholar</a><br>
                </p>
            </aside>
        </div>
    </div>

    {% if site.google_analytics %}
    <script type="text/javascript ">
        (function(i, s, o, g, r, a, m) {
            i['GoogleAnalyticsObject'] = r;
            i[r] = i[r] || function() {
                (i[r].q = i[r].q || []).push(arguments)
            }, i[r].l = 1 * new Date();
            a = s.createElement(o),
                m = s.getElementsByTagName(o)[0];
            a.async = 1;
            a.src = g;
            m.parentNode.insertBefore(a, m)
        })(window, document, 'script', '//www.google-analytics.com/analytics.js', 'ga');
        ga('create', '{{ site.google_analytics }}', 'auto');
        ga('send', 'pageview');
    </script>
    {% endif %}
</body>

</html>
