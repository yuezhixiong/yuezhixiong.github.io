<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Search</title>
    <link rel="stylesheet" href="external_style.css">
    <link rel="bookmark icon" href="/oli_favicon.ico">
</head>

<body>
    <!-- https://www.bing.com/images/search?q= -->
    <form>
        <input id="text" name="q" type="text" autofocus=true spellcheck="true" />
<!--         <input type="submit" formaction="http://www.google.com/search" value="Google" id="submit" /> -->
        <input type="submit" formaction="https://cn.bing.com/dict/search" value="必应词典" id="submit" />
        <input type="button" value="百度" id="submit" onclick="baidu();" />
        <input type="submit" formaction="https://www.zhihu.com/search" value="知乎" id="submit" />
        <input type="submit" formaction="https://www.bing.com/images/search" value="必应图片" id="submit" />
        <input type="submit" formaction="https://scholar.google.com/scholar" value="谷歌学术" id="submit" />
        <input type="submit" formaction="https://www.douban.com/search" value="豆瓣" id="submit" />
        <input type="button" value="哔哩哔哩" id="submit" onclick="bilibili();" />
        <input type="button" value="谷歌翻译" id="submit" onclick="GoogleTranslate();" />
        <input type="submit" formaction="https://www.youtube.com/search" value="YouTube" id="submit" />
    </form>

    <script type="text/javascript">
        function baidu() {
            text = document.getElementById('text').value;
            url = 'https://www.baidu.com/s?wd=' + text;
            window.open(url, '_blank');
        }

        function bilibili() {
            text = document.getElementById('text').value;
            url = 'https://search.bilibili.com/all?keyword=' + text;
            window.open(url, '_blank');
        }

        function GoogleTranslate() {
            text = document.getElementById('text').value;
            url = 'https://translate.google.com/?hl=zh-CN&tab=wT#view=home&op=translate&sl=zh-CN&tl=en&text=' + text;
            window.open(url, '_blank');
        }
    </script>

</body>

</html>
