<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Search</title>
    <link rel="stylesheet" href="external_style.css">
</head>

<body>
    <!-- https://www.bing.com/images/search?q= -->
    <form>
        <input id="text" name="q" type="text" autofocus=true spellcheck="true" />
        <input type="submit" formaction="http://www.google.com/search" value="Google" id="submit" />
        <input type="submit" formaction="http://www.youtube.com/search" value="YouTube" id="submit" />
        <input type="submit" formaction="https://www.bing.com/images/search" value="BingImage" id="submit" />
        <input type="submit" formaction="http://www.zhihu.com/search" value="知乎" id="submit" />
        <input type="submit" formaction="https://www.douban.com/search" value="豆瓣" id="submit" />
        <input type="button" value="百度" id="submit" onclick="baidu();" />
        <input type="button" value="哔哩哔哩" id="submit" onclick="bilibili();" />
    </form>

    <script type="text/javascript">
        function baidu() {
            text = document.getElementById('text').value;
            url = 'https://www.baidu.com/s?wd=' + text;
            window.open(url, '_blank');
        }

        function bilibili() {
            text = document.getElementById('text').value;
            url = 'https://search.bilibili.com/all?keyword=' + text;
            window.open(url, '_blank');
        }
    </script>
    <div class="wrapper">
        <div class="one">
            <a href='https://jingyan.baidu.com/user/nuc'><img src="jingyan.png"></a>
        </div>
        <div class="two">
            <a href='https://yuezhixiong.github.io/ECharts/gold.html'><img src="gold.png"></a>
        </div>
        <div class="three">
            <a href='https://yuezhixiong.github.io/ECharts/AUD.html'><img src="AUD.jpg"></a>
        </div>
        <div class="four">Four</div>
        <div class="five">Five</div>
        <div class="six">Six</div>
    </div>
</body>

</html>
