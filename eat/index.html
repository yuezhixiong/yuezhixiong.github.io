<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="从杭州西湖体育馆出发，在步行一千米范围内随机选择真实餐厅。">
  <title>今天吃什么 · 西湖体育馆附近餐厅</title>
  <link rel="stylesheet" href="styles.css?v=20260811-history-v4">
</head>
<body>
  <main class="app-shell">
    <header class="site-header">
      <a class="brand" href="#" aria-label="今天吃什么首页">
        <span class="brand-mark" aria-hidden="true">吃</span>
        <span>今天吃什么</span>
      </a>
      <div class="header-meta">
        <span class="status-dot" aria-hidden="true"></span>
        <span>西湖体育馆 · 步行 1000 m 内</span>
        <span class="restaurant-count" id="restaurant-count">10 家</span>
      </div>
    </header>

    <section class="decision-board" aria-labelledby="page-title">
      <div class="map-panel">
        <div class="map-heading">
          <div>
            <h1 id="page-title">走出体育馆，<br>让运气带路。</h1>
          </div>
          <p>含步行约 1000 m 内餐厅，以及点评橙V 1 km 内套餐门店。<br>面积越大，被选中的概率越高。</p>
        </div>

        <section class="vote-toolbar" aria-label="餐厅选择">
          <div class="vote-intro">
            <span>点击餐厅进行选择</span>
            <p id="selection-summary">还没有选择餐厅</p>
          </div>
          <label class="selected-only-control" for="selected-only">
            <input id="selected-only" type="checkbox">
            <span class="toggle-track" aria-hidden="true"><span></span></span>
            <span class="toggle-copy">
              <strong>仅抽已选</strong>
              <small>等概率</small>
            </span>
          </label>
          <div class="toolbar-actions" aria-label="选择操作">
            <button class="toolbar-action" id="clear-selections" type="button" disabled>清空</button>
            <button class="toolbar-action" id="reset-selection" type="button">重置</button>
            <button class="toolbar-action toolbar-start" id="toolbar-draw-button" type="button">开始</button>
          </div>
        </section>

        <nav class="area-filter" id="area-filter" aria-label="按区域颜色筛选随机范围"></nav>

        <div class="treemap-wrap">
          <div class="treemap" id="treemap" aria-label="按权重显示的餐厅矩形地图"></div>
          <button class="map-corner" id="corner-draw-button" type="button" aria-label="开始随机选择餐厅">WEIGHTED<br>PICK</button>
        </div>
      </div>

      <aside class="control-panel" aria-label="随机选择控制台">
        <div class="panel-topline">
          <span>西湖体育馆出发</span>
          <span id="round-label">ROUND 01</span>
        </div>

        <div class="result" id="result" aria-live="polite">
          <p class="result-label" id="result-label">等待开饭</p>
          <h2 id="result-name">会是哪一家？</h2>
          <p class="result-detail" id="result-detail">附近餐厅已经就位，距离越近的餐厅获得略高权重。</p>
        </div>

        <section class="draw-history" aria-labelledby="draw-history-title">
          <div class="draw-history-heading">
            <h3 id="draw-history-title">随机记录</h3>
            <span id="draw-history-count">0 轮</span>
          </div>
          <ol class="draw-history-list" id="draw-history-list">
            <li class="draw-history-empty">还没有抽签记录</li>
          </ol>
        </section>

        <div class="weight-legend">
          <span>低权重</span>
          <div class="legend-line" aria-hidden="true"></div>
          <span>高权重</span>
        </div>

        <button class="draw-button" id="draw-button" type="button">
          <span class="button-label">开始随机</span>
          <span class="button-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M5 12h13M14 7l5 5-5 5"/>
            </svg>
          </span>
        </button>
        <p class="shortcut-hint">按空格键也可以开始</p>

        <div class="panel-footer">
          <span>选择逻辑</span>
          <strong id="selection-rule">面积 = 概率</strong>
        </div>
      </aside>
    </section>
  </main>

  <script src="app.js?v=20260811-history-v4"></script>
</body>
</html>
